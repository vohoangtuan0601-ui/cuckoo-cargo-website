<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — Cuckoo Cargo</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="../logo.png" alt="Cuckoo Cargo" style="height:60px;object-fit:contain" onerror="this.style.display='none'"/>
      <div class="brand">🐦 Cuckoo Cargo</div>
      <div class="sub">Internal Management System</div>
    </div>
    <div id="alertBox"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="staff@cuckoocargo.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" onclick="login()">
      Login
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  auth.onAuthStateChanged(u => { if (u) location.href = 'dashboard.html'; });

  function login() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    if (!email || !pass) { alert('Please enter email and password'); return; }
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => location.href = 'dashboard.html')
      .catch(e => {
        const box = document.getElementById('alertBox');
        box.innerHTML = `<div class="alert alert-danger">Login failed: ${e.message}</div>`;
      });
  }

  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
