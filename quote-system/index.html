<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — Cuckoo Cargo</title>
  <base href="/quote-system/"/>
  <link rel="stylesheet" href="css/styles.css?v=3"/>
  <style>
    .login-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
      padding:20px;
    }
    .login-card{
      background:#fff;
      border-radius:20px;
      padding:44px 40px 36px;
      width:100%;
      max-width:400px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);
    }
    .login-logo{
      text-align:center;
      margin-bottom:28px;
    }
    .login-logo img{
      height:90px;
      width:auto;
      object-fit:contain;
      display:block;
      margin:0 auto 14px;
    }
    .login-logo .brand{
      font-size:26px;
      font-weight:900;
      color:#f97316;
      letter-spacing:.5px;
    }
    .login-logo .sub{
      font-size:12.5px;
      color:#6b7280;
      margin-top:4px;
      font-weight:500;
    }
    .login-divider{
      border:none;
      border-top:1px solid #f1f5f9;
      margin:0 0 24px;
    }
    .login-card .form-group label{
      font-size:13px;
      font-weight:700;
      color:#374151;
    }
    .login-card .form-group input{
      padding:11px 14px;
      border-radius:10px;
      border:1.5px solid #e5e7eb;
      font-size:14px;
    }
    .login-card .form-group input:focus{
      border-color:#f97316;
      box-shadow:0 0 0 3px rgba(249,115,22,.1);
    }
    .btn-login{
      width:100%;
      justify-content:center;
      padding:12px;
      font-size:15px;
      border-radius:10px;
      background:linear-gradient(135deg,#f97316,#ea6c0a);
      color:#fff;
      border:none;
      font-weight:700;
      cursor:pointer;
      transition:all .2s;
      margin-top:8px;
      font-family:inherit;
    }
    .btn-login:hover{
      transform:translateY(-1px);
      box-shadow:0 6px 20px rgba(249,115,22,.4);
    }
    .login-footer{
      text-align:center;
      margin-top:20px;
      font-size:11.5px;
      color:#9ca3af;
    }
  </style>
</head>

    <div class="form-group">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  auth.onAuthStateChanged(u => { if (u) location.href = 'dashboard.html'; });

  function login() {
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    if (!email || !pass) {
      showAlert('Vui lòng nhập email và mật khẩu', 'danger');
      return;
    }
    const btn = document.querySelector('.btn-login');
    btn.textContent = '⏳ Đang đăng nhập...';
    btn.disabled = true;
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => location.href = 'dashboard.html')
      .catch(e => {
        btn.textContent = '🔐 Đăng nhập';
        btn.disabled = false;
        const msg = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
          ? 'Email hoặc mật khẩu không đúng.'
          : 'Lỗi đăng nhập: ' + e.message;
        showAlert(msg, 'danger');
      });
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }

  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });
</script>
