<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Cuckoo Cargo</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">🐦 Cuckoo Cargo</div>
  <div class="navbar-nav">
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="quote-form.html">New Quote</a>
    <a class="nav-link active" href="#">Admin</a>
    <button class="btn-logout" onclick="auth.signOut().then(()=>location.href='index.html')">Logout</button>
  </div>
</nav>
<div class="container">
  <h1 class="page-title">⚙️ Admin Settings</h1>
  <div id="alertBox"></div>

  <!-- PRICING TIERS -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
      <span>💲 Pricing Tiers</span>
      <button class="btn btn-primary btn-sm" onclick="showAddTier()">+ Add Tier</button>
    </div>
    <div class="card-body" style="padding:0">
      <div class="table-wrap">
        <table class="data-tbl">
          <thead>
            <tr>
              <th>Min Weight (lbs)</th>
              <th>Max Weight (lbs)</th>
              <th>Price ($/lb or flat)</th>
              <th>Pricing Type</th>
              <th>Service Type</th>
              <th>Carrier</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tiersBody">
            <tr><td colspan="7" style="text-align:center;padding:20px;color:#6b7280">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT TIER FORM -->
  <div class="card" id="tierForm" style="margin-bottom:20px;display:none">
    <div class="card-header" id="tierFormTitle">Add New Tier</div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
        <div class="form-group" style="margin:0">
          <label>Min Weight (lbs)</label>
          <input type="number" id="tf-min" placeholder="0" step="0.1" min="0"/>
        </div>
        <div class="form-group" style="margin:0">
          <label>Max Weight (lbs)</label>
          <input type="number" id="tf-max" placeholder="999" step="0.1"/>
        </div>
        <div class="form-group" style="margin:0">
          <label>Price ($)</label>
          <input type="number" id="tf-price" placeholder="5.00" step="0.01" min="0"/>
        </div>
        <div class="form-group" style="margin:0">
          <label>Pricing Type</label>
          <select id="tf-type">
            <option value="perLbs">Per Pound ($/lb)</option>
            <option value="flat">Flat Rate ($)</option>
          </select>
        </div>
        <div class="form-group" style="margin:0">
          <label>Service Type</label>
          <select id="tf-service">
            <option value="">All</option>
            <option value="intl">USA→Vietnam</option>
            <option value="domestic">Domestic USA</option>
            <option value="shopping">Shopping Proxy</option>
          </select>
        </div>
        <div class="form-group" style="margin:0">
          <label>Carrier (optional)</label>
          <input type="text" id="tf-carrier" placeholder="FedEx, UPS, etc."/>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="btn btn-primary" onclick="saveTier()">💾 Save Tier</button>
        <button class="btn btn-outline" onclick="cancelTier()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- CARRIERS -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-header">🚚 Carriers</div>
    <div class="card-body">
      <div class="form-group">
        <label>Carrier List (one per line)</label>
        <textarea id="carrierList" rows="5" placeholder="FedEx&#10;UPS&#10;USPS&#10;DHL"></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveCarriers()">💾 Save Carriers</button>
    </div>
  </div>

  <!-- CUSTOMERS -->
  <div class="card">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
      <span>👥 Customers</span>
      <button class="btn btn-primary btn-sm" onclick="showAddCustomer()">+ Add Customer</button>
    </div>
    <div class="card-body" id="customerFormWrap" style="display:none;border-bottom:1px solid #f1f5f9;margin-bottom:0">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
        <div class="form-group" style="margin:0"><label>Code</label><input type="text" id="cust-code" placeholder="CAC001"/></div>
        <div class="form-group" style="margin:0"><label>Name</label><input type="text" id="cust-name" placeholder="Full name"/></div>
        <div class="form-group" style="margin:0"><label>Phone</label><input type="text" id="cust-phone" placeholder="+1..."/></div>
        <div class="form-group" style="margin:0;grid-column:span 2"><label>Address</label><input type="text" id="cust-addr" placeholder="Address"/></div>
        <div class="form-group" style="margin:0"><label>Email</label><input type="email" id="cust-email" placeholder="email"/></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button class="btn btn-primary btn-sm" onclick="saveCustomer()">Save</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('customerFormWrap').style.display='none'">Cancel</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-tbl">
        <thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr></thead>
        <tbody id="custBody"><tr><td colspan="6" style="text-align:center;padding:20px;color:#6b7280">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'index.html'; return; }
  loadTiers();
  loadCarriers();
  loadCustomers();
});

// ── PRICING TIERS ──
let tiers = [];
let editTierId = null;

async function loadTiers() {
  const snap = await db.collection('pricingTiers').orderBy('minWeight').get();
  tiers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderTiers();
}

function renderTiers() {
  if (!tiers.length) {
    document.getElementById('tiersBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#6b7280">No pricing tiers. Add one above.</td></tr>';
    return;
  }
  document.getElementById('tiersBody').innerHTML = tiers.map(t => `
    <tr>
      <td>${t.minWeight}</td>
      <td>${t.maxWeight || '∞'}</td>
      <td style="font-weight:700;color:#f97316">$${t.price}</td>
      <td><span class="badge ${t.pricingType==='flat'?'badge-blue':'badge-green'}">${t.pricingType==='flat'?'Flat Rate':'Per Pound'}</span></td>
      <td>${t.serviceType || 'All'}</td>
      <td>${t.carrier || '–'}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="editTier('${t.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTier('${t.id}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

function showAddTier() {
  editTierId = null;
  document.getElementById('tf-min').value    = '';
  document.getElementById('tf-max').value    = '';
  document.getElementById('tf-price').value  = '';
  document.getElementById('tf-type').value   = 'perLbs';
  document.getElementById('tf-service').value= '';
  document.getElementById('tf-carrier').value= '';
  document.getElementById('tierFormTitle').textContent = 'Add New Tier';
  document.getElementById('tierForm').style.display = '';
  document.getElementById('tierForm').scrollIntoView({behavior:'smooth'});
}

function editTier(id) {
  const t = tiers.find(x => x.id === id);
  if (!t) return;
  editTierId = id;
  document.getElementById('tf-min').value    = t.minWeight || '';
  document.getElementById('tf-max').value    = t.maxWeight || '';
  document.getElementById('tf-price').value  = t.price || '';
  document.getElementById('tf-type').value   = t.pricingType || 'perLbs';
  document.getElementById('tf-service').value= t.serviceType || '';
  document.getElementById('tf-carrier').value= t.carrier || '';
  document.getElementById('tierFormTitle').textContent = 'Edit Tier';
  document.getElementById('tierForm').style.display = '';
  document.getElementById('tierForm').scrollIntoView({behavior:'smooth'});
}

function cancelTier() {
  editTierId = null;
  document.getElementById('tierForm').style.display = 'none';
}

async function saveTier() {
  const data = {
    minWeight:   parseFloat(document.getElementById('tf-min').value)   || 0,
    maxWeight:   parseFloat(document.getElementById('tf-max').value)   || null,
    price:       parseFloat(document.getElementById('tf-price').value) || 0,
    pricingType: document.getElementById('tf-type').value,
    serviceType: document.getElementById('tf-service').value || null,
    carrier:     document.getElementById('tf-carrier').value.trim() || null,
  };
  try {
    if (editTierId) {
      await db.collection('pricingTiers').doc(editTierId).update(data);
      showAlert('Tier updated!', 'success');
    } else {
      await db.collection('pricingTiers').add(data);
      showAlert('Tier added!', 'success');
    }
    cancelTier();
    loadTiers();
  } catch(e) { showAlert('Error: ' + e.message, 'danger'); }
}

async function deleteTier(id) {
  if (!confirm('Delete this tier?')) return;
  await db.collection('pricingTiers').doc(id).delete();
  loadTiers();
}

// ── CARRIERS ──
async function loadCarriers() {
  try {
    const doc = await db.collection('settings').doc('carriers').get();
    if (doc.exists && doc.data().list) {
      document.getElementById('carrierList').value = doc.data().list.join('\n');
    } else {
      document.getElementById('carrierList').value = 'FedEx\nUPS\nUSPS\nDHL';
    }
  } catch(e) {}
}

async function saveCarriers() {
  const list = document.getElementById('carrierList').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  await db.collection('settings').doc('carriers').set({ list });
  showAlert('Carriers saved!', 'success');
}

// ── CUSTOMERS ──
let customers = [];
let editCustId = null;

async function loadCustomers() {
  const snap = await db.collection('customers').orderBy('code').get();
  customers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderCustomers();
}

function renderCustomers() {
  if (!customers.length) {
    document.getElementById('custBody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#6b7280">No customers yet.</td></tr>';
    return;
  }
  document.getElementById('custBody').innerHTML = customers.map(c => `
    <tr>
      <td style="font-weight:700">${c.code || '–'}</td>
      <td>${c.name || '–'}</td>
      <td>${c.phone || '–'}</td>
      <td>${c.email || '–'}</td>
      <td style="font-size:12px">${c.address || '–'}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteCustomer('${c.id}')">🗑️</button></td>
    </tr>
  `).join('');
}

function showAddCustomer() {
  document.getElementById('cust-code').value  = '';
  document.getElementById('cust-name').value  = '';
  document.getElementById('cust-phone').value = '';
  document.getElementById('cust-addr').value  = '';
  document.getElementById('cust-email').value = '';
  document.getElementById('customerFormWrap').style.display = '';
}

async function saveCustomer() {
  const code = document.getElementById('cust-code').value.trim().toUpperCase();
  if (!code) { showAlert('Customer code required.', 'danger'); return; }
  const data = {
    code,
    name:    document.getElementById('cust-name').value.trim(),
    phone:   document.getElementById('cust-phone').value.trim(),
    address: document.getElementById('cust-addr').value.trim(),
    email:   document.getElementById('cust-email').value.trim(),
  };
  try {
    await db.collection('customers').doc(code).set(data);
    showAlert('Customer saved!', 'success');
    document.getElementById('customerFormWrap').style.display = 'none';
    loadCustomers();
  } catch(e) { showAlert('Error: ' + e.message, 'danger'); }
}

async function deleteCustomer(id) {
  if (!confirm('Delete customer?')) return;
  await db.collection('customers').doc(id).delete();
  loadCustomers();
}

function showAlert(msg, type) {
  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => box.innerHTML = '', 4000);
}
</script>
</body>
</html>
